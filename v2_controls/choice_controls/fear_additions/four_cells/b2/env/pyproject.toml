[project]
name = "consequential-choice-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.11.0", "transformers==5.12.1", "peft==0.20.0", "numpy==2.3.4",
  "safetensors==0.6.2", "huggingface-hub==1.16.1", "scipy==1.16.3", "nvidia-ml-py==13.580.82"
]
[tool.uv]
constraint-dependencies = ["numpy<2.4", "scipy!=1.18.*"]
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
